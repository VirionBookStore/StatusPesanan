<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Cek Status Pesanan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

  <!-- HALAMAN LOGIN -->
  <div id="loginSection" class="flex items-center justify-center flex-grow p-4">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
      <div class="text-center mb-6">
        <div id="loginLogoContainer" class="flex justify-center mb-2">
            <div id="defaultLoginLogo" class="inline-flex bg-blue-600 text-white font-bold p-3 rounded-xl text-xl shadow-md">CSP</div>
            <img id="customLoginLogo" src="" alt="Logo" class="hidden h-16 w-auto object-contain drop-shadow-sm">
        </div>
        <h1 class="text-2xl font-bold text-slate-800">App Cek Status Pesanan</h1>
        <p class="text-sm text-slate-500 mt-1">Silakan masuk menggunakan akun Anda</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input type="text" id="username" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Username...">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Password...">
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition shadow-md text-sm">Masuk</button>
      </form>
      <div id="alertBox" class="mt-4 hidden p-3 rounded-xl text-sm text-center"></div>
    </div>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="dashboardSection" class="hidden flex-grow flex flex-col pb-6">
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm sticky top-0 z-40">
      <div class="flex items-center space-x-2.5">
        <div id="headerLogoContainer">
            <div id="defaultHeaderLogo" class="bg-blue-600 text-white font-bold p-2 rounded-lg text-sm">CSP</div>
            <img id="customHeaderLogo" src="" alt="Logo" class="hidden h-8 w-auto object-contain">
        </div>
        <div>
          <h2 class="font-bold text-slate-800 text-sm sm:text-base leading-tight">App Cek Status Pesanan</h2>
          <p class="text-[10px] sm:text-xs text-slate-500"><span id="userNameText" class="font-semibold text-slate-700"></span> (<span id="userRoleText" class="uppercase font-bold text-blue-600"></span>)</p>
        </div>
      </div>
      <div class="flex space-x-2">
        <button id="btnSettingLogo" onclick="openLogoModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition border hidden">Ubah Logo</button>
        <button onclick="handleLogout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition border border-rose-200">Keluar</button>
      </div>
    </header>

    <main class="max-w-6xl w-full mx-auto p-1 sm:p-6 space-y-4 flex-grow">
      <div class="bg-white p-2 sm:p-5 rounded-lg sm:rounded-2xl shadow-sm border border-slate-200 space-y-3 w-full">
        
        <div class="border-b border-gray-100 pb-2 mb-2 px-1 sm:px-0">
            <h2 class="font-bold text-sm text-gray-800 uppercase">RINCIAN PESANAN</h2>
        </div>

        <!-- TATA LETAK: 1 BARIS UNTUK PEMESAN, STATUS, DAN TOMBOL BAGIKAN -->
        <div class="flex gap-2 px-1 sm:px-0 w-full mb-1">
            <select id="filterPemesan" onchange="filterDanRenderLokal()" class="border border-gray-300 rounded-lg px-2 py-1.5 text-xs text-gray-700 flex-1 bg-white focus:outline-none focus:ring-1 focus:ring-blue-500 min-w-0 truncate">
                <option value="semua">Pemesan...</option>
            </select>
            
            <select id="filterStatusApp" onchange="filterDanRenderLokal()" class="border border-gray-300 rounded-lg px-2 py-1.5 text-xs text-gray-700 flex-1 bg-white focus:outline-none focus:ring-1 focus:ring-blue-500 min-w-0 truncate">
                <option value="SEMUA">Semua Status</option>
                <option value="STOCK SYSTEM">Stock System</option>
                <option value="READY">Ready</option>
                <option value="KIRIM">Kirim</option>
                <option value="SAMPAI">Sampai</option>
                <option value="SELESAI">Selesai</option>
                <option value="BATAL">Batal</option>
                <option value="KOSONG">Kosong</option>
            </select>

            <!-- TOMBOL BAGIKAN (GANTI EXCEL) -->
            <button onclick="shareDataReport()" class="border border-blue-300 rounded-lg px-2.5 py-1.5 bg-blue-50 text-xs text-blue-700 flex items-center justify-center gap-1 hover:bg-blue-100 transition shrink-0 font-medium" title="Bagikan Laporan">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                <span class="hidden sm:inline">Bagikan</span>
            </button>
        </div>

        <!-- TATA LETAK: 1 BARIS UNTUK PENCARIAN & ICON SYNC -->
        <div class="flex gap-2 px-1 sm:px-0 w-full mb-3">
            <input type="text" id="searchJudul" oninput="filterDanRenderLokal()" placeholder="Cari judul buku..." class="border border-gray-300 rounded-lg px-3 py-1.5 text-xs text-gray-700 flex-grow bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
            
            <button onclick="loadRiwayatPesanan(true)" class="border border-gray-300 rounded-lg w-8 sm:w-10 flex-shrink-0 flex items-center justify-center bg-gray-50 text-gray-700 hover:bg-gray-100 transition" title="Refresh / Sync">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>

        <div id="listPesananContainer" class="space-y-3 w-full">
            <div class="text-center text-slate-400 text-xs py-3">Memuat riwayat...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL PENGATURAN LOGO -->
  <div id="logoModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-3 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-4 space-y-3 border">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">Pengaturan Logo App</h3>
        <button onclick="closeLogoModal()" class="font-bold text-xl">&times;</button>
      </div>
      <form onsubmit="event.preventDefault(); handleSaveLogo(event);" class="space-y-3 text-xs">
        <div>
            <label class="block mb-1 font-semibold">Link Gambar Online / Drive</label>
            <input type="text" id="logoUrlInput" placeholder="Paste link gambar disini..." class="w-full p-2 border rounded-lg">
        </div>
        <div class="flex justify-end pt-2 border-t">
            <button type="button" onclick="closeLogoModal()" class="mr-2 px-3 py-2 bg-slate-100 text-slate-700 rounded-lg font-semibold">Batal</button>
            <button type="submit" id="saveLogoBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold">Simpan Logo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- GLOBAL SCRIPT -->
  <script>
    // ==============================================================================
    // GANTI LINK DI BAWAH DENGAN URL GOOGLE APPS SCRIPT ANDA YANG BARU DI-DEPLOY
    // ==============================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyj_SH2R2a1wjup0Tc_Yufgx2x-XGfAL9ODrVIYMsVcjCyTIe8Nd6H0WZRKt4FfsO65Ng/exec";

    let currentUserRole = '';
    let currentIdAkses = '';
    
    let globalPesananData = []; 
    let currentFilteredData = [];

    async function callGasApi(action, payload = {}) {
      if (GAS_URL === "URL_WEB_APP_GAS_ANDA_DISINI" || !GAS_URL) {
          return { status: 'error', message: 'GAS_URL belum diatur di file HTML!' };
      }
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, payload: payload })
        });
        return await response.json();
      } catch (err) {
        return { status: 'error', message: err.toString() };
      }
    }

    const fmt = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);

    window.onload = function() {
      callGasApi('getAppConfig').then(res => { if(res && res.logoUrl) updateUICustomLogo(res.logoUrl); });
      const savedUser = localStorage.getItem('so_user_nama');
      const savedRole = localStorage.getItem('so_user_role');
      const savedIdAkses = localStorage.getItem('so_user_id_akses');
      
      if (savedUser && savedRole) masukDashboard(savedUser, savedRole, savedIdAkses);
    };

    function handleLogin(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      submitBtn.disabled = true; submitBtn.textContent = 'Memeriksa...';
      alertBox.classList.add('hidden');

      callGasApi('login', { username: document.getElementById('username').value, password: document.getElementById('password').value })
        .then(response => {
          submitBtn.disabled = false; submitBtn.textContent = 'Masuk';
          if (response.status === 'success') {
            localStorage.setItem('so_user_nama', response.nama);
            localStorage.setItem('so_user_role', response.role);
            localStorage.setItem('so_user_id_akses', response.id_akses);
            masukDashboard(response.nama, response.role, response.id_akses);
          } else {
            alertBox.textContent = response.message;
            alertBox.className = 'mt-4 p-3 rounded-xl text-sm text-center bg-rose-50 text-rose-700 border block';
          }
        });
    }

    function masukDashboard(nama, role, idAkses) {
      currentUserRole = role || '';
      currentIdAkses = idAkses || '';
      
      document.getElementById('userNameText').textContent = nama;
      document.getElementById('userRoleText').textContent = role;
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');

      if (currentUserRole.toLowerCase() === 'owner') {
          document.getElementById('btnSettingLogo').classList.remove('hidden');
      }
      loadDaftarPemesan(); 
    }

    function handleLogout() {
      if (confirm("Apakah anda benar ingin keluar?")) { localStorage.clear(); location.reload(); }
    }

    function loadDaftarPemesan() {
      const cachedPemesan = localStorage.getItem('cache_pemesan_' + currentUserRole);
      if (cachedPemesan) {
        try { renderPemesanOptions(JSON.parse(cachedPemesan)); } catch(e) {}
      }

      callGasApi('getPemesan', { role: currentUserRole, id_akses: currentIdAkses }).then(res => {
        if (res.status === 'success' && res.data.length > 0) {
          localStorage.setItem('cache_pemesan_' + currentUserRole, JSON.stringify(res.data));
          renderPemesanOptions(res.data);
        }
      });
    }

    function renderPemesanOptions(data) {
      const select = document.getElementById('filterPemesan');
      const currentSelected = select.value;
      let options = `<option value="semua">Semua Pemesan</option>`;
      data.forEach(nama => { options += `<option value="${nama}">${nama}</option>`; });
      select.innerHTML = options;
      
      if (currentSelected && currentSelected !== "semua") {
        select.value = currentSelected;
      }
      
      loadRiwayatPesanan(false);
    }

    function filterDanRenderLokal() {
        const filterNama = document.getElementById('filterPemesan').value;
        const keywordJudul = document.getElementById('searchJudul').value.toLowerCase();
        const filterStatus = document.getElementById('filterStatusApp').value.toUpperCase();
        
        currentFilteredData = globalPesananData.filter(item => {
            const cocokPemesan = (filterNama === "semua") || (item.sheetPemesan === filterNama);
            const judulStr = (item.judul || "").toLowerCase();
            const cocokJudul = judulStr.includes(keywordJudul);
            const statusStr = (item.status || "").toUpperCase().trim();
            const cocokStatus = (filterStatus === "SEMUA") || (statusStr === filterStatus);
            
            return cocokPemesan && cocokJudul && cocokStatus;
        });
        
        renderPesanan(currentFilteredData);
    }

    function loadRiwayatPesanan(forceRefresh = false) {
      const container = document.getElementById('listPesananContainer');
      const cacheKey = `cache_pesanan_${currentUserRole}_${currentIdAkses}_master`;

      if (!forceRefresh && globalPesananData.length > 0) {
        filterDanRenderLokal();
        return;
      }

      if (!forceRefresh) {
        const cachedData = localStorage.getItem(cacheKey);
        if (cachedData) {
          try {
            globalPesananData = JSON.parse(cachedData);
            filterDanRenderLokal();
          } catch(e) {}
        } else {
          container.innerHTML = `<div class="text-center text-slate-400 text-xs py-8">Memuat data dari server...</div>`;
        }
      } else {
        container.innerHTML = `<div class="text-center text-slate-400 text-xs py-8">Menyinkronkan data dengan server...</div>`;
      }

      callGasApi('getPesanan', { 
          namaPemesan: "semua", 
          role: currentUserRole,
          id_akses: currentIdAkses
      }).then(res => {
        if (res.status === 'success') {
            globalPesananData = res.data; 
            localStorage.setItem(cacheKey, JSON.stringify(res.data));
            filterDanRenderLokal();
        } else if (!localStorage.getItem(cacheKey)) {
            container.innerHTML = `<div class="text-center text-rose-500 text-xs py-3">Gagal memuat data dari server.</div>`;
        }
      });
    }

    // =========================================================================
    // FITUR BAGIKAN (SHARE API) - BISA LANGSUNG KE WA ATAU SIMPAN KE FILE/DRIVE
    // =========================================================================
    function shareDataReport() {
        if (!currentFilteredData || currentFilteredData.length === 0) {
            alert("Tidak ada data untuk dibagikan!");
            return;
        }

        let isUser = currentUserRole.toLowerCase() === 'user';
        let textReport = "📋 *LAPORAN STATUS PESANAN*\n";
        textReport += `Tanggal: ${new Date().toLocaleDateString('id-ID')}\n`;
        textReport += `Total Item: ${currentFilteredData.length}\n\n`;

        currentFilteredData.forEach((item, index) => {
            textReport += `${index + 1}. *${item.judul}*\n`;
            textReport += `   - Pemesan: ${item.sheetPemesan}\n`;
            textReport += `   - Qty: ${item.qty} | Status: *${item.status}*\n`;
            if (!isUser) {
                textReport += `   - Netto: ${fmt(item.netto)}\n`;
            }
            textReport += `-------------------\n`;
        });

        // Cek apakah perangkat mendukung Web Share API (Standar Android WebView & Browser HP)
        if (navigator.share) {
            navigator.share({
                title: 'Laporan Status Pesanan',
                text: textReport,
            }).then(() => {
                console.log('Berhasil dibagikan');
            }).catch((error) => {
                console.log('Bagikan dibatalkan', error);
            });
        } else {
            // Fallback jika tidak didukung: Salin teks otomatis ke clipboard
            navigator.clipboard.writeText(textReport).then(() => {
                alert("Laporan berhasil disalin ke clipboard! Silakan tempel (paste) langsung ke WhatsApp.");
            }).catch(err => {
                alert("Gagal menyalin teks laporan.");
            });
        }
    }

    function getStatusColor(statusStr) {
      statusStr = statusStr.toUpperCase().trim();
      if (statusStr === 'STOCK SYSTEM') return "bg-slate-100 text-slate-700 border-slate-300"; 
      if (statusStr === 'READY') return "bg-blue-100 text-blue-700 border-blue-300"; 
      if (statusStr === 'KIRIM') return "bg-orange-100 text-orange-700 border-orange-300"; 
      if (statusStr === 'SAMPAI') return "bg-fuchsia-100 text-fuchsia-700 border-fuchsia-300"; 
      if (statusStr === 'SELESAI') return "bg-green-100 text-green-700 border-green-300"; 
      if (statusStr === 'BATAL') return "bg-rose-100 text-rose-700 border-rose-300"; 
      if (statusStr === 'KOSONG') return "bg-purple-100 text-purple-700 border-purple-300"; 
      return "bg-gray-100 text-gray-700 border-gray-300"; 
    }

    function changeStatus(selectElem, pemesan, rowIndex) {
      const newStatus = selectElem.value;
      
      let newClass = getStatusColor(newStatus);
      selectElem.className = newClass + " text-[9px] md:text-[10px] font-bold px-1.5 md:px-2 py-1 border rounded uppercase tracking-tighter outline-none cursor-pointer text-center w-full min-w-[75px] md:min-w-[95px]";

      const itemIndex = globalPesananData.findIndex(item => item.sheetPemesan === pemesan && item.rowIndex === rowIndex);
      if (itemIndex !== -1) {
        globalPesananData[itemIndex].status = newStatus;
        
        const cacheKey = `cache_pesanan_${currentUserRole}_${currentIdAkses}_master`;
        localStorage.setItem(cacheKey, JSON.stringify(globalPesananData));
        
        filterDanRenderLokalTunda();
      }

      callGasApi('updateStatus', { namaPemesan: pemesan, rowIndex: rowIndex, newStatus: newStatus })
      .then(res => {
        if (res.status !== 'success') {
          alert("Gagal menyinkronkan status ke server: " + res.message);
          loadRiwayatPesanan(true); 
        }
      });
    }
    
    function filterDanRenderLokalTunda() {
        setTimeout(() => { filterDanRenderLokal(); }, 400); 
    }

    function renderPesanan(data) {
      const container = document.getElementById('listPesananContainer');
      if (!data || data.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 text-xs py-3">Tidak ada data pesanan ditemukan.</div>`;
        return;
      }

      let isOwner = currentUserRole.toLowerCase() === 'owner';
      let isUser = currentUserRole.toLowerCase() === 'user'; 
      
      let totalBrutto = 0, totalNetto = 0;
      let validItemCount = 0; 
      
      data.forEach(item => { 
        let currentStatus = item.status.toString().toUpperCase().trim();
        if (currentStatus === 'KIRIM' || currentStatus === 'SAMPAI') {
          totalBrutto += item.brutto; 
          totalNetto += item.netto; 
          validItemCount += 1;
        }
      });

      let html = `
      <div class="mb-4 bg-blue-50 border border-blue-200 rounded-xl p-3 sm:p-4 flex justify-between items-center shadow-sm mx-1 sm:mx-0 transition-all">
          <div>
              <div class="text-[10px] sm:text-[11px] text-blue-600 font-bold uppercase tracking-wider">Total (Kirim/Sampai)</div>
              <div class="text-[11px] sm:text-xs text-slate-500 font-medium mt-0.5">${validItemCount} dari ${data.length} Item</div>
          </div>
          ${!isUser ? `
          <div class="text-right">
              <div class="text-[10px] sm:text-[11px] text-slate-500">Brutto: <span class="font-semibold text-slate-700">${fmt(totalBrutto)}</span></div>
              <div class="text-xs sm:text-sm text-blue-700 font-bold mt-1">Netto: ${fmt(totalNetto)}</div>
          </div>
          ` : ''}
      </div>`;

      // TABEL DESKTOP
      html += `
      <div class="hidden md:block overflow-x-auto bg-white border border-gray-200 rounded-xl shadow-sm">
          <table class="w-full text-left text-xs whitespace-nowrap">
              <thead class="bg-gray-50 border-b border-gray-200 text-gray-600 uppercase tracking-wider text-[10px]">
                  <tr>
                      <th class="p-3 font-bold">Judul</th>
                      <th class="p-3 font-bold text-right">Harga</th>
                      ${!isUser ? `<th class="p-3 font-bold text-center">Disc</th>` : ''}
                      <th class="p-3 font-bold text-center">Qty</th>
                      ${!isUser ? `<th class="p-3 font-bold text-right">Tot Brutto</th>` : ''}
                      ${!isUser ? `<th class="p-3 font-bold text-right">Tot Netto</th>` : ''}
                      <th class="p-3 font-bold text-center">Status</th>
                  </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">`;

      data.forEach(item => {
        const colorDisc = item.disc > 0 ? "text-red-500" : "text-gray-400";
        let bgStatus = getStatusColor(item.status);

        html += `<tr class="hover:bg-slate-50 transition">
                      <td class="p-3 font-bold text-gray-800 whitespace-normal min-w-[200px] leading-relaxed">${item.judul}</td>
                      <td class="p-3 text-right text-gray-600">${fmt(item.harga)}</td>
                      ${!isUser ? `<td class="p-3 text-center font-bold ${colorDisc}">${item.disc}%</td>` : ''}
                      <td class="p-3 text-center font-bold text-gray-800">${item.qty}</td>
                      ${!isUser ? `<td class="p-3 text-right text-gray-600">${fmt(item.brutto)}</td>` : ''}
                      ${!isUser ? `<td class="p-3 text-right font-bold text-blue-600">${fmt(item.netto)}</td>` : ''}
                      <td class="p-3 text-center">
                          ${isOwner ? `
                          <select onchange="changeStatus(this, '${item.sheetPemesan}', ${item.rowIndex})" class="${bgStatus} text-[10px] font-bold px-2 py-1 border rounded-md uppercase tracking-wider outline-none cursor-pointer text-center min-w-[95px]">
                              <option value="Stock System" ${item.status.toUpperCase() === 'STOCK SYSTEM' ? 'selected' : ''}>Stock System</option>
                              <option value="Ready" ${item.status.toUpperCase() === 'READY' ? 'selected' : ''}>Ready</option>
                              <option value="Kirim" ${item.status.toUpperCase() === 'KIRIM' ? 'selected' : ''}>Kirim</option>
                              <option value="Sampai" ${item.status.toUpperCase() === 'SAMPAI' ? 'selected' : ''}>Sampai</option>
                              <option value="Selesai" ${item.status.toUpperCase() === 'SELESAI' ? 'selected' : ''}>Selesai</option>
                              <option value="Batal" ${item.status.toUpperCase() === 'BATAL' ? 'selected' : ''}>Batal</option>
                              <option value="Kosong" ${item.status.toUpperCase() === 'KOSONG' ? 'selected' : ''}>Kosong</option>
                          </select>
                          ` : `
                          <span class="${bgStatus} text-[10px] font-bold px-2 py-1 border rounded-md uppercase tracking-wider inline-block min-w-[85px]">
                              ${item.status}
                          </span>
                          `}
                      </td>
                  </tr>`;
      });
      html += `</tbody></table></div>`;

      // TABEL MOBILE
      html += `
      <div class="block md:hidden border-t border-b sm:border border-gray-200 sm:rounded-xl shadow-sm -mx-2 sm:mx-0 overflow-hidden bg-white">
          <table class="w-full text-left text-[10px] sm:text-xs">
              <thead class="bg-gray-50 border-b border-gray-200 text-gray-500 uppercase tracking-wider text-[8px] sm:text-[9px]">
                  <tr>
                      <th class="p-1.5 sm:p-2 font-bold w-[40%]">Judul</th>
                      <th class="p-1.5 sm:p-2 font-bold text-right leading-tight">Harga${!isUser ? '<br>Disc' : ''}</th>
                      ${!isUser ? `<th class="p-1.5 sm:p-2 font-bold text-right leading-tight">Brutto<br>Netto</th>` : ''}
                      <th class="p-1.5 sm:p-2 font-bold text-center leading-tight">Status<br>Qty</th>
                  </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">`;

      data.forEach(item => {
        const colorDisc = item.disc > 0 ? "text-red-500" : "text-gray-400";
        let bgStatus = getStatusColor(item.status);

        html += `<tr class="hover:bg-slate-50 transition">
                      <td class="p-1.5 sm:p-2 font-bold text-gray-800 leading-tight pr-1 whitespace-normal align-middle">
                          ${item.judul}
                      </td>
                      <td class="p-1.5 sm:p-2 text-right align-middle whitespace-nowrap">
                          <div class="text-gray-700">${fmt(item.harga)}</div>
                          ${!isUser ? `<div class="font-bold ${colorDisc} mt-0.5">${item.disc}%</div>` : ''}
                      </td>
                      ${!isUser ? `
                      <td class="p-1.5 sm:p-2 text-right align-middle whitespace-nowrap">
                          <div class="text-gray-400 line-through text-[9px]">${fmt(item.brutto)}</div>
                          <div class="font-bold text-blue-600 mt-0.5">${fmt(item.netto)}</div>
                      </td>` : ''}
                      <td class="p-1 sm:p-2 text-center align-middle whitespace-nowrap">
                          <div class="flex flex-col items-center justify-center gap-1">
                              ${isOwner ? `
                              <select onchange="changeStatus(this, '${item.sheetPemesan}', ${item.rowIndex})" class="${bgStatus} text-[9px] font-bold px-1.5 py-1 border rounded uppercase tracking-tighter outline-none cursor-pointer text-center w-full min-w-[75px]">
                                  <option value="Stock System" ${item.status.toUpperCase() === 'STOCK SYSTEM' ? 'selected' : ''}>Stock System</option>
                                  <option value="Ready" ${item.status.toUpperCase() === 'READY' ? 'selected' : ''}>Ready</option>
                                  <option value="Kirim" ${item.status.toUpperCase() === 'KIRIM' ? 'selected' : ''}>Kirim</option>
                                  <option value="Sampai" ${item.status.toUpperCase() === 'SAMPAI' ? 'selected' : ''}>Sampai</option>
                                  <option value="Selesai" ${item.status.toUpperCase() === 'SELESAI' ? 'selected' : ''}>Selesai</option>
                                  <option value="Batal" ${item.status.toUpperCase() === 'BATAL' ? 'selected' : ''}>Batal</option>
                                  <option value="Kosong" ${item.status.toUpperCase() === 'KOSONG' ? 'selected' : ''}>Kosong</option>
                              </select>
                              ` : `
                              <span class="${bgStatus} text-[9px] font-bold px-1.5 py-1 border rounded uppercase tracking-tighter inline-block min-w-[65px] text-center">
                                  ${item.status}
                              </span>
                              `}
                              <span class="font-bold text-gray-700 text-[10px]">Qty: ${item.qty}</span>
                          </div>
                      </td>
                  </tr>`;
      });
      html += `</tbody></table></div>`;

      container.innerHTML = html;
    }

    function openLogoModal() { document.getElementById('logoModal').classList.remove('hidden'); document.getElementById('logoModal').classList.add('flex'); }
    function closeLogoModal() { document.getElementById('logoModal').classList.add('hidden'); document.getElementById('logoModal').classList.remove('flex'); }
    function handleSaveLogo(event) {
      const urlInput = document.getElementById('logoUrlInput').value;
      const btn = document.getElementById('saveLogoBtn');
      btn.disabled = true; btn.textContent = "Menyimpan...";
      callGasApi('updateLogoConfig', { linkUrl: urlInput }).then(res => {
          btn.disabled = false; btn.textContent = "Simpan Logo";
          if (res.status === 'success') { updateUICustomLogo(res.logoUrl); closeLogoModal(); } else alert(res.message);
      });
    }
    function updateUICustomLogo(url) {
      if(!url) return;
      document.getElementById('defaultLoginLogo').classList.add('hidden');
      document.getElementById('defaultHeaderLogo').classList.add('hidden');
      const lgLogin = document.getElementById('customLoginLogo');
      const lgHead = document.getElementById('customHeaderLogo');
      lgLogin.src = url; lgHead.src = url;
      lgLogin.classList.remove('hidden'); lgHead.classList.remove('hidden');
    }
  </script>
</body>
</html>
